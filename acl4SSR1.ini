[custom]
;不要随意改变关键字，否则会导致出错
;acl4SSR规则

;去广告：已禁用
;自动测速：支持
;微软分流：支持
;苹果分流：支持
;增强中国IP段：不支持
;增强国外GFW：不支持

; ==========================================================
; --- Google 翻译与 Chrome 插件分流修复 (最优先匹配) ---
; ==========================================================
ruleset=🚀 节点选择,[]DOMAIN,translate.google.com
ruleset=🚀 节点选择,[]DOMAIN,translate.googleapis.com
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,translate.google.com
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,translate.googleapis.com
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,translate-pa.googleapis.com
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,translation.googleapis.com
ruleset=🚀 节点选择,[]DOMAIN-KEYWORD,translate.google

; ==========================================================
; --- 基础规则配置 ---
; ==========================================================
ruleset=🎯 全球直连,rules/ACL4SSR/Clash/LocalAreaNetwork.list
ruleset=🎯 全球直连,rules/ACL4SSR/Clash/GoogleCN.list
ruleset=🎯 全球直连,rules/ACL4SSR/Clash/Ruleset/SteamCN.list
ruleset=Ⓜ️ 微软服务,rules/ACL4SSR/Clash/Microsoft.list
ruleset=🍎 苹果服务,rules/ACL4SSR/Clash/Apple.list
ruleset=🌍 国外媒体,rules/ACL4SSR/Clash/ProxyMedia.list
ruleset=📲 电报信息,rules/ACL4SSR/Clash/Telegram.list
ruleset=🚀 节点选择,rules/ACL4SSR/Clash/ProxyLite.list
ruleset=🎯 全球直连,rules/ACL4SSR/Clash/ChinaDomain.list
ruleset=🎯 全球直连,rules/ACL4SSR/Clash/ChinaCompanyIp.list
ruleset=🎯 全球直连,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL

; ==========================================================
; --- 策略组配置 ---
; ==========================================================
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]DIRECT`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🌍 国外媒体`select`[]🚀 节点选择`[]♻️ 自动选择`[]🎯 全球直连`.*
custom_proxy_group=📲 电报信息`select`[]🚀 节点选择`[]🎯 全球直连`.*
custom_proxy_group=Ⓜ️ 微软服务`select`[]🎯 全球直连`[]🚀 节点选择`.*
custom_proxy_group=🍎 苹果服务`select`[]🚀 节点选择`[]🎯 全球直连`.*
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择`[]♻️ 自动选择
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]🎯 全球直连`[]♻️ 自动选择`.*

enable_rule_generator=true
overwrite_original_rules=true

; ==========================================================
; --- 解决 Redir-Host 模式下的 Google 翻译 DNS 污染 ---
; ==========================================================
[dns]
enable=true
ipv6=false
enhanced-mode=redir-host
nameserver=119.29.29.29, 223.5.5.5
fallback=https://1.1.1.1/dns-query, https://8.8.8.8/dns-query
fallback-filter=geoip:true
nameserver-policy=translate.google.com:https://1.1.1.1/dns-query, translate.googleapis.com:https://1.1.1.1/dns-query, translate-pa.googleapis.com:https://8.8.8.8/dns-query, translation.googleapis.com:https://8.8.8.8/dns-query

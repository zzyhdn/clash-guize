[custom]

; ==========================================================
; 方案 B 优化版
; Mihomo / OpenClash
; 优化：
; 1. Chrome Google 翻译
; 2. Bigo 稳定代理
; 3. 亚洲节点自动选择
; 4. CF 优选
; ==========================================================
enable_rule_generator=true
overwrite_original_rules=true
; ==========================================================
; 节点清洗
; ==========================================================
exclude=流量|套餐|到期|剩余|重置|官网|网站|最新网址|防失联|失联|公告|通知|TG|Telegram|电报|群|频道|说明|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Official|Website
; ==========================================================
; 1. 高优先级规则
; ==========================================================
; ==========================================================
; Bigo
; ==========================================================
ruleset=🎥 Bigo,[]DOMAIN-KEYWORD,bigo
ruleset=🎥 Bigo,[]DOMAIN-SUFFIX,bigo.tv
ruleset=🎥 Bigo,[]DOMAIN-SUFFIX,bigo.com
ruleset=🎥 Bigo,[]DOMAIN-SUFFIX,bigoapi.com
ruleset=🎥 Bigo,[]DOMAIN-SUFFIX,qichiyu.com
; ==========================================================
; DNS
; ==========================================================
ruleset=DIRECT,[]DST-PORT,53
; ==========================================================
; 内网直连
; ==========================================================
ruleset=DIRECT,[]IP-CIDR,192.168.0.0/16,no-resolve
ruleset=DIRECT,[]IP-CIDR,10.0.0.0/8,no-resolve
ruleset=DIRECT,[]IP-CIDR,172.16.0.0/12,no-resolve
; ==========================================================
; Google Chrome 翻译
; 必须放在 GEOSITE CN 前
; ==========================================================
; 翻译核心
ruleset=🔎 Google,[]DOMAIN-SUFFIX,translate.googleapis.com
ruleset=🔎 Google,[]DOMAIN-SUFFIX,translate-pa.googleapis.com
ruleset=🔎 Google,[]DOMAIN-SUFFIX,translate.google.com
ruleset=🔎 Google,[]DOMAIN-SUFFIX,translate.googleusercontent.com
ruleset=🔎 Google,[]DOMAIN-SUFFIX,translate-pa.googleapis.com
ruleset=🔎 Google,[]DOMAIN-SUFFIX,clientservices.googleapis.com
ruleset=🔎 Google,[]DOMAIN-SUFFIX,play.googleapis.com

; Google API
ruleset=🔎 Google,[]DOMAIN-SUFFIX,googleapis.com
ruleset=🔎 Google,[]DOMAIN-SUFFIX,googleusercontent.com
ruleset=🔎 Google,[]DOMAIN-SUFFIX,gstatic.com
; Chrome 服务
ruleset=🔎 Google,[]DOMAIN-SUFFIX,clients1.google.com
ruleset=🔎 Google,[]DOMAIN-SUFFIX,clients2.google.com
ruleset=🔎 Google,[]DOMAIN-SUFFIX,clients3.google.com
ruleset=🔎 Google,[]DOMAIN-SUFFIX,clients4.google.com
ruleset=🔎 Google,[]DOMAIN-SUFFIX,clients5.google.com
ruleset=🔎 Google,[]DOMAIN-SUFFIX,clients6.google.com
; Chrome 翻译相关
ruleset=🔎 Google,[]DOMAIN-SUFFIX,chrome.google.com
ruleset=🔎 Google,[]DOMAIN-SUFFIX,chromewebstore.googleusercontent.com
ruleset=🔎 Google,[]DOMAIN-SUFFIX,ogs.google.com
ruleset=🔎 Google,[]DOMAIN-SUFFIX,chrometranslate.googleapis.com
ruleset=🔎 Google,[]DOMAIN-SUFFIX,optimizationguide-pa.googleapis.com
ruleset=🔎 Google,[]DOMAIN-SUFFIX,connectivitycheck.gstatic.com
; Google RPC
ruleset=🔎 Google,[]DOMAIN-SUFFIX,mtalk.google.com
; GVT资源
ruleset=🔎 Google,[]DOMAIN-SUFFIX,gvt1.com
ruleset=🔎 Google,[]DOMAIN-SUFFIX,gvt2.com
ruleset=🔎 Google,[]DOMAIN-SUFFIX,gvt3.com
ruleset=🔎 Google,[]DOMAIN-SUFFIX,beacons.gcp.gvt2.com
ruleset=🔎 Google,[]DOMAIN-SUFFIX,beacons2.gvt2.com
; 翻译关键词兜底
ruleset=🔎 Google,[]DOMAIN-KEYWORD,translate
; ==========================================================
; 其他直连
; ==========================================================
rule=DOMAIN-SUFFIX,tailscale.com,DIRECT
rule=DOMAIN-SUFFIX,ts.net,DIRECT
rule=DOMAIN-SUFFIX,log.tailscale.io,DIRECT
rule=DOMAIN-SUFFIX,log.tailscale.com,DIRECT
rule=DOMAIN-SUFFIX,amaigg.eu,DIRECT
rule=DOMAIN-SUFFIX,hp.com,DIRECT
rule=DOMAIN-SUFFIX,hpe.com,DIRECT
rule=DOMAIN-SUFFIX,hpconnected.com,DIRECT
rule=DOMAIN-SUFFIX,hpsupport.com,DIRECT
rule=DOMAIN-SUFFIX,opensubtitles.com,DIRECT
; ==========================================================
; 私有网络
; ==========================================================
ruleset=DIRECT,[]GEOSITE,private
ruleset=DIRECT,[]GEOIP,private,no-resolve
; ==========================================================
; Adobe
; ==========================================================
ruleset=🟥 Adobe,[]GEOSITE,adobe
; ==========================================================
; Aethersailor 规则
; ==========================================================
ruleset=DIRECT,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.yaml,28800
ruleset=DIRECT,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml,28800
ruleset=🚀 手动选择,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.yaml,28800
ruleset=🚀 手动选择,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Classical_IP.yaml,28800
; ==========================================================
; 2. 应用分流规则
; ==========================================================
; ==========================================================
; AI
; ==========================================================
ruleset=🤖 ChatGPT,[]GEOSITE,openai
ruleset=🧠 AI,[]GEOSITE,category-ai-!cn
; ==========================================================
; Apple
; ==========================================================
ruleset=🍎 Apple,[]GEOSITE,apple
; ==========================================================
; Google 服务
; ==========================================================
ruleset=🔎 Google,[]GEOSITE,google
; ==========================================================
; YouTube
; ==========================================================
ruleset=🎬 YouTube,[]GEOSITE,youtube
; ==========================================================
; Netflix
; ==========================================================
ruleset=🎥 Netflix,[]GEOSITE,netflix
; ==========================================================
; Telegram
; ==========================================================
ruleset=📨 Telegram,[]GEOSITE,telegram
; ==========================================================
; Notion
; ==========================================================
ruleset=📦 Notion,[]GEOSITE,Notion
; ==========================================================
; TikTok
; ==========================================================
ruleset=🎵 TikTok,[]GEOSITE,tiktok
; ==========================================================
; Instagram
; ==========================================================
ruleset=📸 Instagram,[]GEOSITE,instagram
; ==========================================================
; X(Twitter)
; ==========================================================
ruleset=🐦 X,[]GEOSITE,twitter
; ==========================================================
; GitHub
; ==========================================================
ruleset=🧑‍💻 GitHub,[]GEOSITE,github
; ==========================================================
; Steam
; ==========================================================
ruleset=🎮 Steam,[]GEOSITE,steam
; ==========================================================
; 加密货币
; ==========================================================
ruleset=🟦 OKX,[]GEOSITE,okx
ruleset=🟨 Binance,[]GEOSITE,binance
ruleset=🟪 Bybit,[]GEOSITE,bybit
; ==========================================================
; 通讯
; ==========================================================
ruleset=📞 即时通讯,[]GEOSITE,category-communication
ruleset=💬 社交媒体,[]GEOSITE,category-social-media-!cn
; ==========================================================
; Cloudflare
; ==========================================================
ruleset=☁️ cloudflare,[]GEOSITE,cloudflare
; ==========================================================
; Microsoft
; ==========================================================
ruleset=🪟 Microsoft,[]GEOSITE,microsoft
; ==========================================================
; 国内可用 Google 服务
; ==========================================================
ruleset=DIRECT,[]GEOSITE,google-cn
; ==========================================================
; 国内下载 / 游戏 / BT
; ==========================================================
ruleset=DIRECT,[]GEOSITE,category-games@cn
ruleset=DIRECT,[]GEOSITE,category-game-platforms-download
ruleset=DIRECT,[]GEOSITE,category-public-tracker
; ==========================================================
; 国内直连
; ==========================================================
ruleset=DIRECT,[]GEOSITE,cn
ruleset=DIRECT,[]GEOIP,cn,no-resolve
; ==========================================================
; 非标准端口
; ==========================================================
ruleset=🔀 非标端口,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml,28800
; ==========================================================
; ==========================================================
; GFW 兜底
; ==========================================================
ruleset=🚀 手动选择,[]GEOSITE,gfw

; 最终规则
; ==========================================================
ruleset=🐟 漏网之鱼,[]FINAL
; ==========================================================
; 3. 基础策略组
; ==========================================================
custom_proxy_group=🌐 Default`select`[]♻️ 自动选择`[]☁️ CF 优选`[]🇯🇵 JP`[]🇭🇰 HK`[]🇹🇼 TW`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 手动选择`[]DIRECT
custom_proxy_group=🚀 手动选择`select`[]♻️ 自动选择`[]☁️ CF 优选`[]🇯🇵 JP`[]🇭🇰 HK`[]🇹🇼 TW`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 手动选择`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🌐 Default`[]🚀 手动选择`[]♻️ 自动选择`[]DIRECT
; ==========================================================
; 手动节点
; ==========================================================
custom_proxy_group=🧭 手动选择`select`.*
; ==========================================================
; 自动测速
; ==========================================================
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50
; ==========================================================
; 应用策略
; ==========================================================
; Bigo
; 日本优先
custom_proxy_group=🎥 Bigo`select`[]🇯🇵 JP`[]🌐 Default`[]🇭🇰 HK`[]🇹🇼 TW`[]♻️ 自动选择`[]🧭 手动选择`[]DIRECT
; Google
custom_proxy_group=🔎 Google`select`[]🇯🇵 JP`[]🌐 Default`[]☁️ CF 优选`[]♻️ 自动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 手动选择
; ChatGPT
custom_proxy_group=🤖 ChatGPT`select`[]🇯🇵 JP`[]🌐 Default`[]♻️ 自动选择`[]🇸🇬 SG`[]🇺🇸 US`[]🧭 手动选择
; AI
custom_proxy_group=🧠 AI`select`[]🇯🇵 JP`[]🌐 Default`[]♻️ 自动选择`[]🇸🇬 SG`[]🇺🇸 US`[]🧭 手动选择
; YouTube
custom_proxy_group=🎬 YouTube`select`[]🇯🇵 JP`[]☁️ CF 优选`[]🌐 Default`[]♻️ 自动选择`[]🇺🇸 US`[]🧭 手动选择
; Netflix
custom_proxy_group=🎥 Netflix`select`[]🇯🇵 JP`[]🇺🇸 US`[]🌐 Default`[]♻️ 自动选择`[]🧭 手动选择
; Telegram
custom_proxy_group=📨 Telegram`select`[]🇯🇵 JP`[]🇸🇬 SG`[]🌐 Default`[]♻️ 自动选择`[]🧭 手动选择`[]DIRECT
; Notion
custom_proxy_group=📦 Notion`select`[]🇯🇵 JP`[]🌐 Default`[]♻️ 自动选择`[]🇺🇸 US`[]🧭 手动选择`[]DIRECT
; Apple
custom_proxy_group=🍎 Apple`select`[]DIRECT`[]🇯🇵 JP`[]🌐 Default`[]♻️ 自动选择
; TikTok
custom_proxy_group=🎵 TikTok`select`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🌐 Default`[]♻️ 自动选择
; Instagram
custom_proxy_group=📸 Instagram`select`[]🇯🇵 JP`[]🇸🇬 SG`[]🌐 Default`[]♻️ 自动选择
; X
custom_proxy_group=🐦 X`select`[]🇯🇵 JP`[]🇺🇸 US`[]🌐 Default`[]♻️ 自动选择
; GitHub
custom_proxy_group=🧑‍💻 GitHub`select`[]🇯🇵 JP`[]☁️ CF 优选`[]🌐 Default`[]♻️ 自动选择
; Steam
custom_proxy_group=🎮 Steam`select`[]DIRECT`[]🇯🇵 JP`[]🌐 Default`[]♻️ 自动选择
; 加密交易
custom_proxy_group=🟦 OKX`select`[]🇯🇵 JP`[]🇸🇬 SG`[]🌐 Default`[]DIRECT
custom_proxy_group=🟨 Binance`select`[]🇯🇵 JP`[]🇸🇬 SG`[]🌐 Default`[]DIRECT
custom_proxy_group=🟪 Bybit`select`[]🇯🇵 JP`[]🇸🇬 SG`[]🌐 Default`[]DIRECT
; Adobe
custom_proxy_group=🟥 Adobe`select`[]🌐 Default`[]🇯🇵 JP`[]🇺🇸 US`[]DIRECT`[]REJECT
; Cloudflare
custom_proxy_group=☁️ cloudflare`select`[]DIRECT`[]🇯🇵 JP`[]🌐 Default`[]☁️ CF 优选
; Microsoft
custom_proxy_group=🪟 Microsoft`select`[]DIRECT`[]🇯🇵 JP`[]🌐 Default`[]♻️ 自动选择
; ==========================================================
; 4. 国家节点测速组
; ==========================================================
; ==========================================================
; Cloudflare 优选
; ==========================================================
custom_proxy_group=☁️ CF 优选`url-test`(?i)CF|Cloudflare|优选|CDN|Anycast|Preferred`http://www.gstatic.com/generate_204`300,,50
; ==========================================================
; 香港
; ==========================================================
custom_proxy_group=🇭🇰 HK`url-test`(?i)HK|香港|HKG|Hong Kong`http://www.gstatic.com/generate_204`300,,50
; ==========================================================
; 台湾
; ==========================================================
custom_proxy_group=🇹🇼 TW`url-test`(?i)TW|台湾|台北|新北|彰化|Hinet|Taiwan`http://www.gstatic.com/generate_204`300,,50
; ==========================================================
; 日本
; ==========================================================
custom_proxy_group=🇯🇵 JP`url-test`(?i)JP|日本|东京|大阪|Tokyo|Osaka|Japan`http://www.gstatic.com/generate_204`300,,50
; ==========================================================
; 新加坡
; ==========================================================
custom_proxy_group=🇸🇬 SG`url-test`(?i)SG|新加坡|狮城|Singapore`http://www.gstatic.com/generate_204`300,,50
; ==========================================================
; 美国
; ==========================================================
custom_proxy_group=🇺🇸 US`url-test`(?i)US|美国|洛杉矶|圣何塞|凤凰城|波特兰|United States|Los Angeles`http://www.gstatic.com/generate_204`300,,50
; ==========================================================
; 冷门节点池
; 排除常用地区和机场提示节点
; ==========================================================
custom_proxy_group=🧊 冷门节点`select`(?i)^(?!.*(HK|香港|HKG|Hong|TW|台湾|Taiwan|JP|日本|Tokyo|Osaka|Japan|SG|新加坡|Singapore|US|美国|United States|CF|Cloudflare|优选|CDN|流量|套餐|到期|剩余|Expire|Traffic)).*
; ==========================================================
; 非标准端口
; ==========================================================
custom_proxy_group=🔀 非标端口`select`[]🎥 Bigo`[]🌐 Default`[]DIRECT`[]🐟 遵循规则
custom_proxy_group=🐟 遵循规则`select`[]🐟 漏网之鱼
